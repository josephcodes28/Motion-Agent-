<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Studio</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0c0f14; --panel:#151a22; --line:#27303d; --fg:#e9edf2; --muted:#8e99a8; --acc:#7c5cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 16px 40px;max-width:560px;margin-inline:auto}
  h1{font-size:20px;margin:4px 0 14px;font-weight:700}
  .stage{background:#000;border-radius:14px;padding:10px;border:1px solid var(--line)}
  canvas{display:block;margin:0 auto;height:min(58vh,640px);width:auto;aspect-ratio:9/16;border-radius:8px;background:#111}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .tabs button{padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-weight:600}
  .tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
  label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
  input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit}
  textarea{min-height:84px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .row button{padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-weight:600}
  .row button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button:disabled{opacity:.6}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b6a6ff;outline-offset:2px}
  .full{width:100%;margin-top:8px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-weight:600}
  .full:focus-visible,#ai:focus-visible,#speak:focus-visible{outline:3px solid #b6a6ff;outline-offset:2px}
  .note{color:var(--muted);font-size:13px;margin-top:14px}
</style>
</head>
<body>
<h1>Motion Studio</h1>

<div class="stage"><canvas id="cv" aria-label="Video preview"></canvas></div>

<div class="tabs" id="tabs" role="group" aria-label="Template"></div>

<label for="topic">What is the video about?</label>
<input id="topic" placeholder="Example: 3 tips to get more barbershop customers">
<div class="row">
  <button id="ai" class="primary">Write script with AI</button>
  <button id="speak">Play voiceover</button>
</div>
<p class="note" id="aiMsg" role="status"></p>

<div id="fields"></div>

<label for="theme">Color theme</label>
<select id="theme"></select>

<label for="voiceSel">Voice for the MP4 version</label>
<select id="voiceSel">
  <option value="en-US-AriaNeural">Aria (US woman)</option>
  <option value="en-US-GuyNeural">Guy (US man)</option>
  <option value="en-US-JennyNeural">Jenny (US woman, calm)</option>
  <option value="en-GB-RyanNeural">Ryan (UK man)</option>
  <option value="en-GB-SoniaNeural">Sonia (UK woman)</option>
</select>

<div class="row">
  <button id="replay">Replay</button>
  <button id="rec" class="primary">Record and download</button>
</div>
<button id="copyJson" class="full">Copy code for MP4 with voice</button>
<p class="note" id="copyMsg" role="status"></p>
<p class="note">Record and download makes a quick 8-second silent preview video. For the full MP4 with voiceover, tap the copy button and paste it into your GitHub render workflow.</p>

<script>
const W = 720, H = 1280, DUR = 8;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

const clamp = x => Math.max(0, Math.min(1, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c = 2.70158; return 1 + c * Math.pow(x - 1, 3) + (c - 1) * Math.pow(x - 1, 2); };

const themes = {
  night:  { name: 'Night and gold',   bg: '#101820', fg: '#f5f3ee', acc: '#ffd23f' },
  sunset: { name: 'Plum and coral',   bg: '#2a0f2e', fg: '#fff1e6', acc: '#ff6b6b' },
  mint:   { name: 'Forest and mint',  bg: '#0b2b26', fg: '#effff8', acc: '#5cf2b0' },
  light:  { name: 'Light and violet', bg: '#f3f4fa', fg: '#14141f', acc: '#5b3df5' }
};

function wrap(text, maxW) {
  const words = text.split(/\s+/).filter(Boolean);
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.rect(x, y, w, h);
}

function drawBg(th, t) {
  ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = 0.13; ctx.fillStyle = th.acc;
  ctx.beginPath(); ctx.arc(W * 0.85 + Math.sin(t * 0.6) * 60, H * 0.15 + Math.cos(t * 0.5) * 60, 260, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.08;
  ctx.beginPath(); ctx.arc(W * 0.1 + Math.cos(t * 0.4) * 50, H * 0.88 + Math.sin(t * 0.55) * 50, 300, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ---------- Template 1: Quote / animated text ---------- */
function drawQuote(t, f, th) {
  drawBg(th, t);
  ctx.font = '700 60px Georgia, "Times New Roman", serif';
  const words = f[0].split(/\s+/).filter(Boolean);
  const maxW = W - 140, lh = 84, sp = ctx.measureText(' ').width;
  const lines = []; let cur = [], cw = 0;
  for (const w of words) {
    const ww = ctx.measureText(w).width;
    if (cur.length && cw + sp + ww > maxW) { lines.push(cur); cur = []; cw = 0; }
    cw += (cur.length ? sp : 0) + ww; cur.push({ w, ww });
  }
  if (cur.length) lines.push(cur);
  const step = Math.min(0.16, 4.5 / Math.max(1, words.length));
  let y = (H - lines.length * lh) / 2;
  const barP = easeOut(clamp(t / 0.8));
  ctx.fillStyle = th.acc; ctx.fillRect(70, y - 80, 150 * barP, 8);
  let idx = 0;
  for (const line of lines) {
    let x = 70;
    for (const o of line) {
      const p = clamp((t - 0.5 - idx * step) / 0.4);
      ctx.globalAlpha = p; ctx.fillStyle = th.fg;
      ctx.fillText(o.w, x, y + 60 + (1 - easeOut(p)) * 30);
      x += o.ww + sp; idx++;
    }
    y += lh;
  }
  ctx.globalAlpha = clamp((t - 0.5 - idx * step - 0.2) / 0.6);
  ctx.font = '500 34px system-ui, sans-serif'; ctx.fillStyle = th.acc;
  if (f[1]) ctx.fillText('\u2014 ' + f[1], 70, y + 40);
  ctx.globalAlpha = 1;
}

/* ---------- Template 2: Explainer with icon shapes ---------- */
function drawShape(i) {
  ctx.beginPath();
  if (i === 0) ctx.arc(0, 0, 55, 0, Math.PI * 2);
  else if (i === 1) { ctx.moveTo(0, -62); ctx.lineTo(62, 48); ctx.lineTo(-62, 48); ctx.closePath(); }
  else ctx.rect(-50, -50, 100, 100);
  ctx.fill();
}
function drawExplainer(t, f, th) {
  drawBg(th, t);
  ctx.font = '800 56px system-ui, sans-serif';
  const tp = easeOut(clamp(t / 0.8));
  ctx.globalAlpha = tp; ctx.fillStyle = th.fg;
  wrap(f[0], W - 140).forEach((l, i) => ctx.fillText(l, 70, 190 + i * 68 - (1 - tp) * 30));
  ctx.globalAlpha = 1;
  const ys = [560, 820, 1080], start = 1.2, gap = 1.6;
  ctx.strokeStyle = th.acc; ctx.lineWidth = 6; ctx.globalAlpha = 0.5;
  for (let i = 0; i < 2; i++) {
    const p = easeOut(clamp((t - (start + i * gap + 0.5)) / 0.9));
    ctx.beginPath(); ctx.moveTo(150, ys[i] + 75);
    ctx.lineTo(150, ys[i] + 75 + (ys[i + 1] - ys[i] - 150) * p); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 3; i++) {
    const p = clamp((t - (start + i * gap)) / 0.6);
    if (p <= 0) continue;
    const s = easeBack(p);
    ctx.save(); ctx.translate(150, ys[i]); ctx.scale(s, s);
    ctx.fillStyle = th.acc; drawShape(i);
    ctx.fillStyle = th.bg; ctx.font = '800 44px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i + 1), 0, i === 1 ? 14 : 0);
    ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = clamp(p * 1.5); ctx.fillStyle = th.fg;
    ctx.font = '600 40px system-ui, sans-serif';
    const lines = wrap(f[i + 1], W - 330);
    lines.forEach((l, j) => ctx.fillText(l, 250 + (1 - p) * 40, ys[i] + 14 + (j - (lines.length - 1) / 2) * 50));
    ctx.globalAlpha = 1;
  }
}

/* ---------- Template 3: Ad / promo for a client ---------- */
function drawPromo(t, f, th) {
  drawBg(th, t);
  ctx.save(); ctx.globalAlpha = 0.07; ctx.fillStyle = th.fg;
  for (let i = -1; i < 6; i++) {
    const x = i * 140 + (t * 40) % 140;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 70, 0); ctx.lineTo(x - 430, H); ctx.lineTo(x - 500, H); ctx.fill();
  }
  ctx.restore();
  const bp = easeOut(clamp(t / 0.7));
  ctx.globalAlpha = bp; ctx.fillStyle = th.acc; ctx.font = '700 40px system-ui, sans-serif';
  ctx.fillText(f[0], 70 - (1 - bp) * 60, 150);
  const hp = easeOut(clamp((t - 0.5) / 0.8));
  ctx.globalAlpha = hp; ctx.fillStyle = th.fg; ctx.font = '800 82px system-ui, sans-serif';
  wrap(f[1], W - 140).forEach((l, i) => ctx.fillText(l, 70, 330 + i * 98 + (1 - hp) * 50));
  ctx.globalAlpha = 1;
  const op = clamp((t - 2) / 0.8);
  if (op > 0) {
    ctx.save(); ctx.translate(W - 200, 900);
    ctx.rotate((1 - easeOut(op)) * -0.9); const s = easeBack(op); ctx.scale(s, s);
    ctx.fillStyle = th.acc; ctx.beginPath(); ctx.arc(0, 0, 140, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = th.bg; ctx.font = '800 46px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const ol = wrap(f[2], 210);
    ol.forEach((l, i) => ctx.fillText(l, 0, (i - (ol.length - 1) / 2) * 54));
    ctx.restore(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  const cp = easeOut(clamp((t - 3.5) / 0.6));
  if (cp > 0) {
    const pulse = 1 + 0.04 * Math.sin(t * 6) * cp;
    ctx.save(); ctx.translate(W / 2, 1120); ctx.scale(pulse * cp, pulse * cp);
    ctx.fillStyle = th.acc; roundRectPath(-260, -55, 520, 110, 55); ctx.fill();
    ctx.fillStyle = th.bg; ctx.font = '800 42px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f[3], 0, 2);
    ctx.restore(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

/* ---------- App wiring ---------- */
const templates = {
  quote: { label: 'Quote / text', draw: drawQuote, fields: [
    ['Quote', 'Be so good they can\u2019t ignore you.', true], ['Author', 'Steve Martin'] ] },
  explainer: { label: 'Explainer', draw: drawExplainer, fields: [
    ['Title', 'How our service works'], ['Step 1', 'Tell us what you need'], ['Step 2', 'We build it fast'], ['Step 3', 'You launch and grow'] ] },
  promo: { label: 'Ad / promo', draw: drawPromo, fields: [
    ['Brand name', 'Fresh Cuts Barbershop'], ['Headline', 'Look sharp this weekend'], ['Offer', '20% off first visit'], ['Button text', 'Book now'] ] }
};
const state = {}; for (const k in templates) state[k] = templates[k].fields.map(f => f[1]);
let cur = 'quote', themeKey = 'night';
const vo = { quote: '', explainer: '', promo: '' };

const tabs = document.getElementById('tabs'), fieldsEl = document.getElementById('fields');
const themeSel = document.getElementById('theme'), recBtn = document.getElementById('rec');

function buildTabs() {
  tabs.innerHTML = '';
  for (const k in templates) {
    const b = document.createElement('button');
    b.textContent = templates[k].label; b.setAttribute('aria-pressed', k === cur);
    b.onclick = () => { cur = k; buildTabs(); buildFields(); restart(); };
    tabs.appendChild(b);
  }
}
function buildFields() {
  fieldsEl.innerHTML = '';
  templates[cur].fields.forEach((fd, i) => {
    const id = 'f' + i;
    const l = document.createElement('label'); l.htmlFor = id; l.textContent = fd[0];
    const inp = document.createElement(fd[2] ? 'textarea' : 'input'); inp.id = id; inp.value = state[cur][i];
    inp.oninput = () => { state[cur][i] = inp.value; };
    fieldsEl.append(l, inp);
  });
  const vl = document.createElement('label'); vl.htmlFor = 'vo'; vl.textContent = 'Voiceover (what the voice says)';
  const vi = document.createElement('textarea'); vi.id = 'vo'; vi.value = vo[cur];
  vi.oninput = () => { vo[cur] = vi.value; };
  fieldsEl.append(vl, vi);
}
for (const k in themes) { const o = document.createElement('option'); o.value = k; o.textContent = themes[k].name; themeSel.appendChild(o); }
themeSel.onchange = () => { themeKey = themeSel.value; };

const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let mode = 'preview', t0 = performance.now(), rec = null, chunks = [];
function restart() { t0 = performance.now(); }
document.getElementById('replay').onclick = restart;

function frame(now) {
  let t = (now - t0) / 1000;
  if (mode === 'preview') t = t % DUR;
  else if (t >= DUR) { finishRecording(); t = DUR - 0.001; }
  ctx.clearRect(0, 0, W, H);
  templates[cur].draw(t, state[cur], themes[themeKey]);
  requestAnimationFrame(frame);
}

function startRecording() {
  if (!window.MediaRecorder) { alert('Recording is not supported in this browser. Open this page in Chrome.'); return; }
  const stream = cv.captureStream(30);
  const type = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'].find(x => MediaRecorder.isTypeSupported(x)) || '';
  chunks = [];
  rec = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 6000000 } : {});
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: rec.mimeType || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'motion-' + cur + (blob.type.includes('mp4') ? '.mp4' : '.webm');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    recBtn.disabled = false; recBtn.textContent = 'Record and download';
    mode = 'preview'; restart();
  };
  rec.start(); mode = 'record'; restart();
  recBtn.disabled = true; recBtn.textContent = 'Recording\u2026 8s';
}
function finishRecording() { if (rec && rec.state === 'recording') rec.stop(); }
recBtn.onclick = startRecording;

const aiBtn = document.getElementById('ai'), aiMsg = document.getElementById('aiMsg');
const topicEl = document.getElementById('topic'), voiceSel = document.getElementById('voiceSel');
const copyMsg = document.getElementById('copyMsg');

aiBtn.onclick = async () => {
  const topic = topicEl.value.trim();
  if (!topic) { aiMsg.textContent = 'Type what the video is about first.'; return; }
  aiBtn.disabled = true; aiMsg.textContent = 'Writing your script\u2026';
  try {
    const r = await fetch('/api/script', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic, template: cur })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');
    const n = templates[cur].fields.length;
    const fields = Array.isArray(d.fields) ? d.fields.slice(0, n) : [];
    while (fields.length < n) fields.push('');
    state[cur] = fields.map(String); vo[cur] = String(d.voiceover || '');
    buildFields(); restart();
    aiMsg.textContent = 'Done. You can edit any line.';
  } catch (e) {
    aiMsg.textContent = 'Could not write the script: ' + e.message;
  }
  aiBtn.disabled = false;
};

document.getElementById('speak').onclick = () => {
  if (!vo[cur].trim()) { aiMsg.textContent = 'There is no voiceover text yet.'; return; }
  if (!('speechSynthesis' in window)) { aiMsg.textContent = 'This browser cannot play voice previews.'; return; }
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(vo[cur]));
  restart();
};

document.getElementById('copyJson').onclick = () => {
  const text = JSON.stringify({ template: cur, theme: themeKey, fields: state[cur], voiceover: vo[cur], voice: voiceSel.value });
  const done = () => { copyMsg.textContent = 'Copied. Paste it into the Render video workflow on GitHub.'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => prompt('Copy this code:', text));
  else prompt('Copy this code:', text);
};

buildTabs(); buildFields(); requestAnimationFrame(frame);
</script>
</body>
</html>
